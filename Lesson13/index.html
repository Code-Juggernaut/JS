<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Користувачі та Публікації (CRUD + Fetch)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 20px auto;
            padding: 0 20px;
            background-color: #f9f9f9;
            color: #333;
        }
        h1, h2 {
            color: #2c3e50;
        }
        .error-box {
            background-color: #f8d7da;
            color: #721c24;
            padding: 15px;
            border: 1px solid #f5c6cb;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2980b9;
        }
        button.danger {
            background-color: #e74c3c;
        }
        button.danger:hover {
            background-color: #c0392b;
        }
        button.warning {
            background-color: #f39c12;
        }
        button.warning:hover {
            background-color: #d68910;
        }
        .user-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
        }
        .card {
            background: white;
            padding: 15px;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card h3 {
            margin: 0 0 10px 0;
            font-size: 18px;
            color: #2980b9;
        }
        .card p {
            margin: 5px 0;
            font-size: 14px;
            color: #555;
        }
        .posts-container {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #eee;
            font-size: 13px;
        }
        .post-item {
            background: #f1f2f6;
            padding: 8px;
            border-radius: 4px;
            margin-top: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .post-actions {
            display: flex;
            gap: 5px;
        }
        .form-section {
            background: white;
            padding: 15px;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 10px;
        }
        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-size: 13px;
            font-weight: bold;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        #loading {
            font-style: italic;
            color: #666;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <h1>Керування користувачами та публікаціями</h1>

    <section class="form-section">
        <h2>Створити нову публікацію</h2>
        <form id="createPostForm">
            <div class="form-group">
                <label for="userIdInput">ID Користувача:</label>
                <input type="number" id="userIdInput" value="1" required min="1">
            </div>
            <div class="form-group">
                <label for="titleInput">Назва публікації:</label>
                <input type="text" id="titleInput" placeholder="Введіть заголовок..." required>
            </div>
            <div class="form-group">
                <label for="bodyInput">Текст публікації:</label>
                <textarea id="bodyInput" placeholder="Введіть текст..." rows="2" required></textarea>
            </div>
            <button type="submit">Створити публікацію</button>
        </form>
    </section>

    <h2>Список користувачів</h2>
    
    <div style="margin-bottom: 15px;">
        <button id="cancelBtn" class="danger" style="display: none;">Скасувати завантаження</button>
    </div>

    <div id="errorContainer" style="display: none;" class="error-box">
        <p id="errorMessage"></p>
        <button id="retryBtn" class="warning">Спробувати знову</button>
    </div>

    <div id="loading">Завантаження користувачів...</div>
    
    <div id="userGrid" class="user-grid"></div>

    <script src="./main.js" defer>
        
    </script>
</body>
</html>
